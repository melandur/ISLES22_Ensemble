[project]
name = "isles22-ensemble"
version = "1.0.0"
description = "ISLES'22 Ischemic Stroke Lesion Segmentation Ensemble Algorithm"
requires-python = "==3.8.*"
readme = "README.md"

dependencies = [
    # === Core Scientific ===
    "numpy==1.23.3",
    "scipy==1.9.1",
    "pandas==1.4.4",
    "sympy==1.11.1",
    
    # === ML/DL Frameworks ===
    # PyTorch with CUDA 11.3 support (installed via uv with PyTorch index)
    "torch==1.11.0",
    "torchvision==0.12.0",
    "torchaudio==0.11.0",
    "pytorch-lightning==1.6.5",
    "torchmetrics==0.9.3",
    "monai[all]==0.9.0",
    "performer-pytorch==1.1.4",
    
    # === Medical Imaging ===
    "nibabel==4.0.2",
    "SimpleITK==2.0.2",
    "SimpleITK-SimpleElastix",
    "MedPy==0.4.0",
    "pydicom==2.3.0",
    "itk",
    # "dicom2nifti",  # Commented out due to python-gdcm build issues
    # If needed, install manually: pip install dicom2nifti
    # Note: python-gdcm (dependency) has known build issues on some systems
    "dcm2niix",
    "openslide-python",
    
    # === Image Processing ===
    "scikit-image==0.19.3",
    "scikit-learn==1.0.2",
    "opencv-python==4.6.0.66",
    "Pillow==10.0.1",
    "imageio==2.19.3",
    
    # === Tensor Operations ===
    "einops==0.4.1",
    "opt_einsum==3.3.0",
    "networkx==2.8.6",
    
    # === nnUNet/SEALS specific ===
    "batchgenerators==0.24",
    "connected-components-3d==3.10.1",
    "tifffile",
    "requests",
    
    # === Utilities ===
    "tqdm==4.64.0",
    "PyYAML==6.0",
    "six==1.16.0",
    "plotly==5.10.0",
    "matplotlib==3.5.2",
    "colorama",
    "gdown",
    "evalutils==0.3.1",
]

[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.uv]
# PyTorch with CUDA 11.3 requires extra index URL:
# --extra-index-url https://download.pytorch.org/whl/cu113
# This is handled in setup_env.sh and Dockerfile
